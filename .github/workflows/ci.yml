name: CI

on:
  push:
    branches: [2026-season-python]
  pull_request:
    branches: [2026-season-python]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
